name: Deploy tutor Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'scripts/verify_release.py'
      - 'tests/worker/**'
      - 'tests/tutor/**'
      - 'src/content/**'
      - 'src/tutor/**'
      - 'scripts/rag/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Test Worker and tutor boundaries
        run: npm test -- tests/worker tests/tutor tests/content
      - name: Verify Worker bundle
        env:
          WRANGLER_LOG_PATH: /tmp/d2l-wrangler.log
        run: npx wrangler deploy --dry-run --config worker/wrangler.jsonc --outdir /tmp/d2l-worker-dry-run
      - name: Audit tracked files, Worker artifacts and optional retrieval configuration
        run: python3 -B scripts/verify_release.py --worker-out /tmp/d2l-worker-dry-run
      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler deploy --config worker/wrangler.jsonc --keep-vars
      - name: Explain skipped deployment
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Worker deployment skipped until Cloudflare repository secrets are configured."
